name: Temporary lockfile refresh

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [master]

permissions:
  contents: read

jobs:
  regenerate:
    if: github.head_ref == 'feature/add-internship-history'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Apply security patches to lockfile
        run: npm audit fix --package-lock-only --no-fund

      - name: Verify security audit
        run: npm audit --audit-level=high

      - name: Output regenerated public lockfile in chunks
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const sharp = lock.packages['node_modules/sharp']?.version;
          const sourceMap = lock.packages['node_modules/source-map-js']?.version;
          if (sharp !== '0.35.5' || sourceMap !== '1.2.2') {
            throw new Error('Expected patched dependencies were not resolved: ' + sharp + ', ' + sourceMap);
          }
          const raw = Buffer.from(JSON.stringify(lock), 'utf8').toString('base64');
          for (let i = 0; i < raw.length; i += 1200) {
            console.log('LOCKCHUNK_' + (i / 1200) + ':' + raw.slice(i, i + 1200));
          }
          console.log('LOCKCHUNK_END:' + Math.ceil(raw.length / 1200));
          NODE
