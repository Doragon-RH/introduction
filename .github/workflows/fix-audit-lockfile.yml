name: Fix npm audit lockfile

on:
  push:
    branches:
      - fix/yaml-audit-vulnerability
    paths:
      - .github/workflows/fix-audit-lockfile.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/yaml-audit-vulnerability

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Apply npm audit fix to lockfile
        run: npm audit fix --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Verify zero audit findings
        run: npm audit --audit-level=moderate

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit lockfile
        run: |
          if git diff --quiet package-lock.json; then
            echo "package-lock.json is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Fix transitive yaml vulnerability"
          git push
